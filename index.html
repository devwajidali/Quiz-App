<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>Quiz App</h1>
    </div>

    <div class="score-board">
        <h4>Score</h4>
        <p id="score">0</p>
    </div>


    <div class="container">
        <div class="quiz">

            <div class="question">
                <h2>Q</h2>
                <h3 id="ques"></h3>
            </div>

        
        

            <div class="options">
                <label  id="option1">
                    <input type="radio" name="opt" id="input1">
                    <p class="option" id="opt1"></p>
                </label>
                <label id="option2">
                    <input type="radio" name="opt" id="input2">
                    <p class="option" id="opt2"></p>
                </label>
                <label id="option3">
                    <input type="radio" name="opt" id="input3">
                    <p class="option" id="opt3"></p>
                </label>
                <label id="option4">
                    <input type="radio" name="opt" id="input4">
                    <p class="option" id="opt4"></p>
                </label>
            </div>
        </div>

        
    
    </div>

    <div class="button hide">
        <button id="restart-btn">Restart Game</button>
    </div>

    <div class="msg hide">
        <p id="msg"></p>
        <button id="next">Next Quiz</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
