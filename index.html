<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>Quiz App</h1>
    </div>
    <div class="container">
        <div class="quiz">

            <div class="question">
                <h2>Q</h2>
                <h3 id="ques">What was the main purpose and reason behind Pakistan creation.</h3>
            </div>

        
        

            <div class="options">
                <label  id="option1">
                    <input type="radio" name="opt" id="1">
                    <p class="option" id="opt1">Hindus Behaviour</p>
                </label>
                <label id="option2">
                    <input type="radio" name="opt" id="2">
                    <p class="option" id="opt2">German</p>
                </label>
                <label id="option3">
                    <input type="radio" name="opt" id="3">
                    <p class="option" id="opt3">Two Nation Theory</p>
                </label>
                <label id="option4">
                    <input type="radio" name="opt" id="4">
                    <p class="option" id="opt4">Islam</p>
                </label>
            </div>
        </div>
    
    </div>

    <div class="msg hide">
        <p id="msg">Correct</p>
        <button id="next">Next Quiz</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
